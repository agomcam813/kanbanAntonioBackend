version: "3.8"
services:
  db:
    build:
      context: ../kanbanAntonio/project/db
      dockerfile: Dockerfile
    ports:
      - "5433:5432"
    expose:
      - 5432
    env_file:
      - ../kanbanAntonio/project/.env

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]


  api:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - project/.env
    depends_on:
      - db
      - redis
volumes:
  redis_data:

