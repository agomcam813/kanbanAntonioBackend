services:
  db:
    build:
      context: project/db
      dockerfile: Dockerfile
    ports:
      - "5433:5432"
    expose:
      - 5432
    env_file:
      - .env

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]


  api:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
volumes:
  redis_data:

